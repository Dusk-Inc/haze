[project]
name = "haze"
version = "0.1.0"
description = "A continuously learning, self-organizing neural mesh with forward-only learning."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["app.tests*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
